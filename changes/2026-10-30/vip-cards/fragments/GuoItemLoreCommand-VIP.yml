VIP1天:
  检测描述: '&a获得1天VIP时限'
  点击类型: 右键
  玩家指令: []
  物品模块:
    需求堆叠数量: 1
    需求不足提示: '&c需要同时持有&e1&c个此物品时才能使用'
    是否消耗物品: true
  冷却模块:
    是否启用该模块: true
    冷却组: VIP
    冷却时间: 1000
    是否提醒冷却中: true
    冷却中提醒信息: '&b冷却还没有结束，请等待%less%'
  后台指令:
  - vipsys give %player% vip4 1d
